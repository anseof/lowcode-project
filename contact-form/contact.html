<!--
  ==========================================================================
  contact.html : the contact form page

  This is the page you open first in a browser. It shows a form with three
  fields (Name, Email address and Message) and a "Send message" button.

  How the pieces fit together:
  - This file holds the page structure (the HTML).
  - style.css controls how the page looks (colours, spacing, layout).
  - script.js checks what the user typed when they press the button, and
    sends them to confirmation.html if everything is valid.

  There is no server in this setup, so the message is not sent anywhere.
  ==========================================================================
-->
<!DOCTYPE html>
<!-- lang="en" tells browsers and screen readers that the page is in English. -->
<html lang="en">
<head>
  <!-- The character set. UTF-8 lets the page show letters such as accents correctly. -->
  <meta charset="UTF-8">

  <!-- Makes the page scale to the width of a phone or tablet screen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- The text shown in the browser tab. -->
  <title>Contact</title>

  <!-- Loads the Archivo font from Google Fonts. If it fails to load (for example,
       when offline), the browser uses Arial or Helvetica instead. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Connects this page to style.css, which holds all the styling rules. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- <main> marks the main content of the page. The container class keeps the
       content at a readable width and centres it. -->
  <main class="container">

    <!-- The white card that holds the form. -->
    <section class="form-card">

      <h1>Contact</h1>

      <!-- Short introduction. The asterisk (*) marks required fields. It is hidden
           from screen readers because aria-required on each input already tells them
           the field is required. -->
      <p class="intro">Send us a message and we will get back to you. Fields marked <span class="required" aria-hidden="true">*</span> are required.</p>

      <!-- The form. novalidate switches off the browser's own pop-up checks so that
           script.js can show our messages instead. The id lets script.js find it. -->
      <form id="contact-form" novalidate>

        <!-- ===== NAME FIELD ===== -->
        <div class="form-group">
          <!-- The label's "for" value matches the input's id, so clicking the label
               moves the cursor into the box and screen readers read the label aloud. -->
          <label for="name">Name <span class="required" aria-hidden="true">*</span></label>

          <!-- A single-line text box.
               autocomplete="name" lets the browser offer to fill in a saved name.
               aria-required="true" tells screen readers the field must be filled in.
               aria-describedby links the box to its hint and error text, so screen
               readers read those out when the box is selected. -->
          <input type="text" id="name" name="name" autocomplete="name"
                 aria-required="true" aria-describedby="name-hint name-error">

          <!-- Hint text shown under the box. -->
          <p class="hint" id="name-hint">Up to 100 characters.</p>

          <!-- Error message for the name. script.js fills this in when the name is
               wrong and leaves it empty when the name is fine. aria-live="polite"
               means screen readers announce the message when it appears. -->
          <p class="error-message" id="name-error" aria-live="polite"></p>
        </div>

        <!-- ===== EMAIL FIELD ===== -->
        <div class="form-group">
          <label for="email">Email address <span class="required" aria-hidden="true">*</span></label>

          <!-- type="email" makes phones show a keyboard with the @ key. The browser
               also does a basic format check, but script.js does the real checking. -->
          <input type="email" id="email" name="email" autocomplete="email"
                 aria-required="true" aria-describedby="email-hint email-error">

          <p class="hint" id="email-hint">For example, name@example.com.</p>

          <!-- Error message for the email address. -->
          <p class="error-message" id="email-error" aria-live="polite"></p>
        </div>

        <!-- ===== MESSAGE FIELD ===== -->
        <div class="form-group">
          <label for="message">Message <span class="required" aria-hidden="true">*</span></label>

          <!-- A multi-line text box. rows="6" sets its starting height in lines. -->
          <textarea id="message" name="message" rows="6"
                    aria-required="true" aria-describedby="message-hint message-error"></textarea>

          <!-- The character counter. script.js updates the text inside the span,
               for example "42 / 2000 characters". -->
          <p class="hint" id="message-hint"><span id="message-counter">0 / 2000 characters</span></p>

          <!-- Error message for the message box. -->
          <p class="error-message" id="message-error" aria-live="polite"></p>
        </div>

        <!-- The submit button. type="submit" makes it send the form, which fires the
             "submit" event that script.js listens for. -->
        <button type="submit" class="btn btn-primary">Send message</button>
      </form>

    </section>
  </main>

  <!-- Loads script.js. It sits at the bottom of the page so that all the elements
       above exist by the time the script runs. -->
  <script src="script.js"></script>
</body>
</html>
