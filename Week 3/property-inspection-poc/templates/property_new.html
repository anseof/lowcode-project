{% extends "base.html" %}
{% block title %}Add property{% endblock %}
{% block content %}
<h1>Add property</h1>

<form method="post" action="{{ url_for('main.create_property') }}">
  <label for="reference">Reference (up to 20 characters)</label>
  <input id="reference" name="reference" required value="{{ values.get('reference', '') }}">
  {% if errors.get('reference') %}<p class="error">{{ errors['reference'] }}</p>{% endif %}

  <label for="address">Address (up to 200 characters)</label>
  <input id="address" name="address" required value="{{ values.get('address', '') }}">
  {% if errors.get('address') %}<p class="error">{{ errors['address'] }}</p>{% endif %}

  <p><button type="submit">Save property</button></p>
</form>
{% endblock %}
