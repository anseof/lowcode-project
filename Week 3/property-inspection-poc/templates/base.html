<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Property Inspections{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
    header { background: #1f3b57; padding: 12px 16px; }
    header a { color: #fff; text-decoration: none; font-weight: bold; }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; word-break: break-word; }
    .error { color: #b00020; font-size: 0.9em; margin: 4px 0 0; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    button, .button { padding: 8px 14px; font: inherit; cursor: pointer; display: inline-block; }
    .section { margin-top: 32px; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('main.index') }}">Property Inspections</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
